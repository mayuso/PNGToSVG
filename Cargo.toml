[package]
name = "pngtosvg"
version = "0.7.0"
edition = "2024"
description = "A CLI tool and library to convert PNG images into SVG vectors."
license = "MIT"
repository = "https://github.com/mayuso/PNGToSVG"
readme = "README.md"
include = ["src/**", "build.rs", "icon.ico", "README.md", "LICENSE"]
keywords = ["png", "svg", "image", "converter", "vector"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
name = "pngtosvg"
path = "src/lib.rs"

[[bin]]
name = "pngtosvg"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
clap = { version = "4.6.7", features = ["derive"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4.0"
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"

[[bench]]
name = "performance"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
